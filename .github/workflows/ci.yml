name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dispatcher/requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: docker compose config
      - run: docker build -t gpu-task-dispatcher:test dispatcher
      - run: docker build -t gpu-task-monitor:test monitor

