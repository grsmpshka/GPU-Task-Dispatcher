services:
  dispatcher:
    build: ./dispatcher
    image: gpu-task-dispatcher:latest
    container_name: gpu-task-dispatcher
    restart: unless-stopped
    network_mode: host
    environment:
      GPU_DISPATCHER_PORT: "11435"
      OLLAMA_URL: "${OLLAMA_URL:-http://127.0.0.1:11434}"
      WHISPER_URL: "${WHISPER_URL:-http://127.0.0.1:8000}"
      GPU_WORKERS_JSON: '${GPU_WORKERS_JSON:-}'
      GPU_DISPATCHER_TOKEN: "${GPU_DISPATCHER_TOKEN}"
      GPU_SERVICE_CANCEL_TOKENS_JSON: '${GPU_SERVICE_CANCEL_TOKENS_JSON:-{}}'
      GPU_MAX_BATCH_TASKS: "${GPU_MAX_BATCH_TASKS:-12}"
      GPU_MAX_BATCH_SECONDS: "${GPU_MAX_BATCH_SECONDS:-300}"
      GPU_REQUEST_TIMEOUT_SECONDS: "${GPU_REQUEST_TIMEOUT_SECONDS:-10800}"
      GPU_OLLAMA_RELEASE_DELAY_SECONDS: "${GPU_OLLAMA_RELEASE_DELAY_SECONDS:-4}"
      GPU_JOB_HISTORY_LIMIT: "${GPU_JOB_HISTORY_LIMIT:-100000}"
      GPU_JOB_PAYLOAD_MAX_BYTES: "${GPU_JOB_PAYLOAD_MAX_BYTES:-16777216}"
      GPU_TASK_IDLE_SECONDS: "${GPU_TASK_IDLE_SECONDS:-10}"
      GPU_WORKER_FAILURE_COOLDOWN_SECONDS: "${GPU_WORKER_FAILURE_COOLDOWN_SECONDS:-60}"
      GPU_DEFAULT_MAX_CONTEXT_TOKENS: "${GPU_DEFAULT_MAX_CONTEXT_TOKENS:-0}"
    volumes:
      - "${GPU_DISPATCHER_DATA_DIR:-/srv/data/gpu-task-dispatcher}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11435/queue', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  monitor:
    build: ./monitor
    image: gpu-task-monitor:latest
    container_name: gpu-task-monitor
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      OLLAMA_URL: "${OLLAMA_URL:-http://127.0.0.1:11434}"
      OLLAMA_URLS: "${OLLAMA_URLS:-http://127.0.0.1:11434}"
      GPU_DISPATCHER_URL: "http://127.0.0.1:11435"
      GPU_DISPATCHER_TOKEN: "${GPU_DISPATCHER_TOKEN}"
      DISK_PATHS: "/hostfs,/hostfs-srv"
      WHISPER_PROCESS_NAMES: "whisper,faster-whisper,whisper.cpp,speaches"
      AI_GPU_PROCESS_NAMES: "ollama,llama-server"
    volumes:
      - /:/hostfs:ro
      - /srv:/hostfs-srv:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    gpus: all
    depends_on:
      dispatcher:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ollama-gpu-1:
    profiles: ["gpu-workers"]
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.33.1}"
    container_name: ollama-gpu-1
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "/root/.ollama/models"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - /srv/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_SLOT_1_DEVICE}"]
              capabilities: [gpu]

  ollama-gpu-2:
    profiles: ["gpu-workers"]
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.33.1}"
    container_name: ollama-gpu-2
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: "127.0.0.1:11436"
      OLLAMA_MODELS: "/root/.ollama/models"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - /srv/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_SLOT_2_DEVICE}"]
              capabilities: [gpu]

  whisper-gpu-1:
    profiles: ["gpu-workers"]
    image: whisper-service:latest
    container_name: whisper-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - "${WHISPER_ENV_FILE:-/opt/whisper-service/.env}"
    environment:
      WHISPER_HOST: "0.0.0.0"
      WHISPER_PORT: "8000"
    volumes:
      - /opt/whisper-service/cache/huggingface:/root/.cache/huggingface
      - /opt/whisper-service/cache/whisper:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_SLOT_1_DEVICE:-0}"]
              capabilities: [gpu]

  whisper-gpu-2:
    profiles: ["gpu-workers"]
    image: whisper-service:latest
    container_name: whisper-service-gpu-2
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - "${WHISPER_ENV_FILE:-/opt/whisper-service/.env}"
    environment:
      WHISPER_HOST: "0.0.0.0"
      WHISPER_PORT: "8000"
    volumes:
      - /opt/whisper-service/cache/huggingface:/root/.cache/huggingface
      - /opt/whisper-service/cache/whisper:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_SLOT_2_DEVICE:-1}"]
              capabilities: [gpu]
